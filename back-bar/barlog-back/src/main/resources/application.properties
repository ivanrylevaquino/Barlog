spring.application.name=barlog-back

# Database Configuration (PostgreSQL 15+)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/barlog}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Google OAuth 2.0
barlog.google.client-id=${GOOGLE_CLIENT_ID:}

# JWT Configuration (HMAC-SHA256, max 24h = 86400000 ms)
barlog.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
barlog.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
barlog.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
